<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spin-warp k-space Simulator with Gradient-synchronized Cursor</title>
<!-- grad12: k-space square cursor moves during Gy and Gx pre, synchronized with gradient timing -->
<style>
:root{
  --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#666;
  --blue:#24427d; --red:#d63849; --orange:#d46a16;
  --green:#196c35;
}
*{box-sizing:border-box}
html,body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif
}
.app{max-width:1080px;margin:auto;padding:8px 6px 24px}
h1{font-size:18px;margin:3px 2px}
.headerline{display:flex;align-items:center;justify-content:space-between;gap:8px}
header p{font-size:11px;color:var(--muted);margin:0 2px 8px}
.status-badge{
  flex:0 0 auto;
  border-radius:999px;
  padding:6px 11px;
  font-size:12px;
  font-weight:900;
  border:2px solid;
  letter-spacing:.02em;
}
.status-badge.off{
  color:#315a39;
  border-color:#78a982;
  background:#edf8ef;
}
.status-badge.on{
  color:#9a2d15;
  border-color:#df755a;
  background:#fff0eb;
}
.offres-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:3px}
.offres-switch button{min-height:39px;padding:5px 3px;font-size:12px;font-weight:900}
.offres-switch button.active-off{color:#315a39;border-color:#78a982;background:#edf8ef;box-shadow:inset 0 0 0 1px #78a982}
.offres-switch button.active-on{color:#9a2d15;border-color:#df755a;background:#fff0eb;box-shadow:inset 0 0 0 1px #df755a}
.df-setting.disabled{opacity:.45}
body.offres-on .card{
  border-color:#e59a86;
}
body.offres-on #real,
body.offres-on #kspace{
  background:#fffaf8;
}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.panel h2{text-align:center;font-size:17px;margin:6px 0}
.card,.controls{background:#fff;border:1px solid #ddd;border-radius:11px}
.card{padding:4px}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{margin-top:8px;padding:9px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
label{font-size:11px;font-weight:700}
.value{display:block;margin-top:3px;font-weight:600;color:#333}
input,select,button{
  width:100%;min-height:39px;border:1px solid #aaa;border-radius:9px;
  background:#fff;font:inherit;padding:7px
}
.coord-stepper{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:4px;
  width:100%;
  min-width:0;
}
.coord-stepper > button{
  flex:0 0 42px;
}
.coord-stepper > input,
.coord-stepper > .number-with-unit{
  flex:1 1 auto;
  min-width:0;
}
.number-with-unit{
  position:relative;
  display:flex;
  align-items:center;
  min-height:39px;
}
.number-with-unit input{
  width:100%;
  padding-right:30px;
}
.number-with-unit .unit{
  position:absolute;
  right:9px;
  margin:0;
  pointer-events:none;
}
.coord-stepper button{
  min-height:39px;
  padding:0;
  font-size:21px;
  line-height:1;
}
.coord-stepper input{
  text-align:center;
  font-weight:800;
  -moz-appearance:textfield;
}
.coord-stepper .unit{
  font-size:12px;
  font-weight:700;
  color:#444;
}
.coord-stepper input::-webkit-outer-spin-button,
.coord-stepper input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
button{font-weight:800}
button.primary{background:#111;color:#fff}
.readout{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.readout div{
  border:1px solid #ddd;border-radius:8px;background:#fafafa;
  text-align:center;padding:6px 2px;font-size:10px
}
.readout b{display:block;font-size:12px;margin-top:2px}
.explain,.testbox{
  margin-top:7px;border-radius:8px;padding:8px;font-size:12px;line-height:1.5
}
.explain{background:#fff7da;border:1px solid #eadb99}
.testbox{background:#eef8f0;border:1px solid #b9d8bf;color:var(--green)}
.testbox.error{background:#fff0ed;border-color:#e2b4aa;color:#8a1f11}

.real-with-gradients{
  position:relative;
  width:100%;
}
.real-main{width:100%;min-width:0}
.gradient-side,.gradient-bottom,.gradient-corner{position:absolute;pointer-events:none;z-index:2}
/* The real-space canvas uses 500×520 internally. Its square grid is x=64..448, y=42..426.
   Place the gradient wedges in the canvas margins so they do not change the canvas width or scale. */
.gradient-side{left:0;top:8.08%;width:12.8%;height:73.85%}
.gradient-bottom{left:12.8%;top:82.7%;width:76.8%;height:8.65%}
.gradient-corner{left:0;top:82.7%;width:12.8%;height:12%;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;font-size:9px;color:#666;text-align:center;line-height:1.25}
.gradient-canvas{display:block;width:100%;height:100%;background:transparent;border:0}
.tr-panel{grid-column:1 / -1;margin-top:1px;background:#f7f9fc;border:1px solid #cbd3df;border-radius:10px;padding:10px 12px}
.tr-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px;font-size:13px;font-weight:800}
.tr-timeline{display:grid;grid-template-columns:.55fr .8fr 1fr 7.2fr;gap:4px}
.tr-segment{position:relative;min-height:48px;border:1px solid #bcc4d0;border-radius:7px;background:#fff;padding:5px 2px;text-align:center;font-size:clamp(8px,1.45vw,10px);display:flex;align-items:center;justify-content:center;line-height:1.05;white-space:nowrap;overflow:hidden}
.tr-segment.active{border:2px solid #d63849;background:#fff1f3;font-weight:900}
.tr-segment.done{background:#eaf0fa;border-color:#879bc0}
.tr-segment .pulse{position:absolute;bottom:3px;left:10%;right:10%;height:4px;border-radius:3px;background:#24427d;opacity:.25}
.tr-segment.active .pulse{opacity:1;background:#d63849}

.tr-kx-row{display:grid;grid-template-columns:.55fr .8fr 1fr 7.2fr;gap:4px;margin-top:5px}
.tr-kx-spacer{min-height:1px}
.tr-kx-track{grid-column:4;display:grid;gap:2px;align-items:center}
.tr-kx-cell{min-width:0;height:25px;border:1px solid #c8ced8;border-radius:5px;background:#fff;text-align:center;font-size:10px;line-height:23px;color:#5f6670;padding:0;overflow:hidden}
.tr-kx-cell.done{background:#eaf0fa;border-color:#879bc0;color:#24427d;font-weight:800}
.tr-kx-cell.active{background:#fff1f3;border:2px solid #d63849;color:#a52133;font-weight:900;line-height:21px}
.tr-kx-track.matrix16 .tr-kx-cell{font-size:7px;border-radius:3px;letter-spacing:-.04em}

.excitation-frame{outline:3px solid rgba(214,56,73,.18);outline-offset:-3px;border-radius:11px}
@media(max-width:680px){
  .two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tr-panel{padding:8px 7px}
  .tr-timeline,.tr-kx-row{grid-template-columns:.52fr .72fr .92fr 6.8fr;gap:3px}
  .tr-segment{font-size:7.5px;min-height:38px;padding:3px 1px}
  .tr-head{font-size:11px}
  .gradient-corner{font-size:7px}
}

@media(max-width:680px){
  h1{font-size:15px}
  .panel h2{font-size:15px}
  .row{grid-template-columns:repeat(2,1fr)}
  .readout{grid-template-columns:repeat(4,1fr)}
  .readout div{font-size:9px}
  .readout b{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="headerline">
    <h1>k-space Phase Vector Simulator</h1>
    <div id="offresStatus" class="status-badge off">オフレゾナンスなし</div>
  </div>
  <p>青＝真の位置、橙＝オフレゾナンス後の再構成位置。</p>
</header>

<main class="two">
  <section class="panel">
    <h2>実空間・再構成位置</h2>
    <div id="realCard" class="card">
      <div class="real-with-gradients">
        <div class="real-main"><canvas id="real" width="500" height="520"></canvas></div>
        <div class="gradient-side"><canvas id="gyCanvas" class="gradient-canvas" width="64" height="384"></canvas></div>
        <div class="gradient-bottom"><canvas id="gxCanvas" class="gradient-canvas" width="384" height="45"></canvas></div>
        <div class="gradient-corner" aria-hidden="true"></div>
      </div>
    </div>
  </section>
  <section class="panel">
    <h2>k空間の位相ベクトル</h2>
    <div class="card"><canvas id="kspace" width="500" height="520"></canvas></div>
  </section>
  <div class="tr-panel">
    <div class="tr-head">
      <span id="excitationLabel">第1励起 / 8　ky = −4</span>
      <span id="gradientLabel">Gx 0 ／ Gy 0</span>
    </div>
    <div class="tr-timeline">
      <div class="tr-segment" data-phase="rf">RF<div class="pulse"></div></div>
      <div class="tr-segment" data-phase="gy">Gy<div class="pulse"></div></div>
      <div class="tr-segment" data-phase="pre">Gx pre<div class="pulse"></div></div>
      <div class="tr-segment" data-phase="readout">Gx readout<div class="pulse"></div></div>
    </div>
    <div class="tr-kx-row" aria-label="readout中のkx取得位置">
      <div class="tr-kx-spacer"></div><div class="tr-kx-spacer"></div><div class="tr-kx-spacer"></div>
      <div id="kxTrack" class="tr-kx-track"></div>
    </div>
  </div>
</main>

<section class="controls">
  <div class="row">
    <label>マトリクス
      <select id="matrix">
        <option value="8">8 × 8</option>
        <option value="16">16 × 16</option>
      </select>
    </label>

    <label>実空間 x座標
      <span class="coord-stepper">
        <button id="pMinus" type="button" aria-label="x座標を左へ1移動">←</button>
        <input id="p" type="number" min="-4" max="3" value="1" readonly>
        <button id="pPlus" type="button" aria-label="x座標を右へ1移動">→</button>
      </span>
    </label>

    <label>実空間 y座標
      <span class="coord-stepper">
        <button id="qMinus" type="button" aria-label="y座標を下へ1移動">↓</button>
        <input id="q" type="number" min="-4" max="3" value="2" readonly>
        <button id="qPlus" type="button" aria-label="y座標を上へ1移動">↑</button>
      </span>
    </label>

    <label>収集方法
      <select id="method">
        <option value="spinwarp">Spin warp</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>ky収集順
      <select id="kyorder">
        <option value="linear">−4 → −3 → −2 → −1 → 0 → 1 → 2 → 3</option>
        <option value="centric">0 → −1 → 1 → −2 → 2 → −3 → 3 → −4</option>
      </select>
    </label>

    <label>受信バンド幅
      <select id="bandwidth">
        <option value="double">2倍受信BW（readout 8 ms）</option>
        <option value="standard">基準受信BW（readout 16 ms）</option>
      </select>
    </label>

    <label>オフレゾナンス
      <span class="offres-switch">
        <button id="offresOff" type="button" class="active-off">なし</button>
        <button id="offresOn" type="button">あり</button>
      </span>
    </label>

    <label id="dfSetting" class="df-setting disabled">オフレゾナンスの程度
      <span class="coord-stepper">
        <button id="dfMinus" type="button" aria-label="オフレゾナンス周波数を下げる" disabled>−</button>
        <span class="number-with-unit">
          <input id="df" type="number" min="-250" max="250" step="125" value="125" readonly disabled>
          <span class="unit">Hz</span>
        </span>
        <button id="dfPlus" type="button" aria-label="オフレゾナンス周波数を上げる" disabled>＋</button>
      </span>
    </label>

    <label>再生速度
      <span class="coord-stepper">
        <button id="speedMinus" type="button" aria-label="再生速度を下げる">−</button>
        <input id="speed" type="number" min="1" max="10" step="1" value="6" readonly>
        <button id="speedPlus" type="button" aria-label="再生速度を上げる">＋</button>
      </span>
    </label>
  </div>

  <div class="row">
    <button id="play" class="primary">実行</button>
    <button id="step">1段階進める</button>
    <button id="fill">全マス表示</button>
    <button id="reset">リセット</button>
  </div>

  <div class="row">
    <button id="showCheck">検算詳細</button>
  </div>



  <div class="readout">
    <div>真の位置<b id="xy">(1,2)</b></div>
    <div>理想周期<b id="cycles">kx 1 / ky 2</b></div>
    <div>Δf<b id="dfRead">0 Hz</b></div>
    <div>readout時間<b id="readoutRead">8 ms</b></div>
    <div>x位置ずれ<b id="shiftRead">0 pixel</b></div>
    <div>y位置ずれ<b id="yShiftRead">0 pixel</b></div>
    <div>見かけの位置<b id="apparentRead">(1,2)</b></div>
    <div>段階<b id="stage">待機</b></div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="testbox" id="testbox">内部検算を実行中…</div>
</section>
</div>

<script>
(() => {
"use strict";

const READOUT_MS = {
  double: 8,
  standard: 16
};

const real = document.getElementById("real");
const kspace = document.getElementById("kspace");
const rctx = real.getContext("2d");
const kctx = kspace.getContext("2d");
const gyCanvas = document.getElementById("gyCanvas");
const gxCanvas = document.getElementById("gxCanvas");
const gyctx = gyCanvas.getContext("2d");
const gxctx = gxCanvas.getContext("2d");
const realCardEl = document.getElementById("realCard");
const excitationLabelEl = document.getElementById("excitationLabel");
const gradientLabelEl = document.getElementById("gradientLabel");
const trSegments = Array.from(document.querySelectorAll(".tr-segment"));
const kxTrackEl = document.getElementById("kxTrack");

const matrixEl = document.getElementById("matrix");
const pEl = document.getElementById("p");
const qEl = document.getElementById("q");
const pMinusEl = document.getElementById("pMinus");
const pPlusEl = document.getElementById("pPlus");
const qMinusEl = document.getElementById("qMinus");
const qPlusEl = document.getElementById("qPlus");
const kyorderEl = document.getElementById("kyorder");
const bandwidthEl = document.getElementById("bandwidth");
const dfEl = document.getElementById("df");
const speedEl = document.getElementById("speed");
const dfMinusEl = document.getElementById("dfMinus");
const dfPlusEl = document.getElementById("dfPlus");
const speedMinusEl = document.getElementById("speedMinus");
const speedPlusEl = document.getElementById("speedPlus");
const offresStatusEl = document.getElementById("offresStatus");
const offresOffEl = document.getElementById("offresOff");
const offresOnEl = document.getElementById("offresOn");
const dfSettingEl = document.getElementById("dfSetting");
const xyEl = document.getElementById("xy");
const cyclesEl = document.getElementById("cycles");
const dfReadEl = document.getElementById("dfRead");
const readoutReadEl = document.getElementById("readoutRead");
const shiftReadEl = document.getElementById("shiftRead");
const yShiftReadEl = document.getElementById("yShiftRead");
const apparentReadEl = document.getElementById("apparentRead");
const stageEl = document.getElementById("stage");
const explainEl = document.getElementById("explain");
const testboxEl = document.getElementById("testbox");
const playBtn = document.getElementById("play");

let N = 8;
let sequence = [];
let seqIndex = 0;
let timer = null;
let vectors = new Map();
let previousVectorPhases = null;
let phaseCompareTimer = null;
let showCheckDetails = false;
let offResonanceEnabled = false;
let lastNonzeroDf = 125;
let current = {stage:"待機", phase:"idle", excitation:0, kx:null, ky:null, adc:false, gx:0, gy:0};

function kMin(){ return -N/2; }
function kMax(){ return N/2-1; }

function clampCentered(value){
  const v = Math.round(Number(value) || 0);
  return Math.max(kMin(), Math.min(kMax(), v));
}

function centeredValues(){
  const out = [];
  for(let v=kMin(); v<=kMax(); v++) out.push(v);
  return out;
}

function kyValues(){
  if(kyorderEl.value === "linear") return centeredValues();

  // 偶数マトリクスのcentric ordering：
  // 0, -1, +1, -2, +2, ... , -N/2
  const out = [0];
  for(let d=1; out.length<N; d++){
    if(-d >= kMin()) out.push(-d);
    if(out.length<N && d <= kMax()) out.push(d);
  }
  return out;
}

function readoutMs(){
  return READOUT_MS[bandwidthEl.value];
}

function offResonanceHz(){
  return offResonanceEnabled ? Number(dfEl.value) : 0;
}

function refreshStoredVectorPhases(){
  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);

  vectors.forEach((rec,key) => {
    const [kx,ky] = key.split(",").map(Number);
    rec.ideal = phaseIdealFor(p,q,kx,ky);
    rec.actual = phaseActualFor(p,q,kx,ky);
  });
}

function setOffResonanceEnabled(enabled){
  if(offResonanceEnabled === enabled) return;

  offResonanceEnabled = enabled;
  if(enabled){
    if(Math.abs(Number(dfEl.value)) < 1e-12){
      dfEl.value = String(lastNonzeroDf);
    }
  }else if(Math.abs(Number(dfEl.value)) > 1e-12){
    lastNonzeroDf = Number(dfEl.value);
  }

  // 取得済みベクトルは残し、現在の条件に合わせて向きだけ更新する。
  refreshStoredVectorPhases();
  runSelfTests();
  render();
}

function offResonanceShiftPixels(){
  // pixel bandwidth = 1 / total readout time
  // shift[pixel] = Δf / BWpixel = Δf × Treadout
  return offResonanceHz() * readoutMs() / 1000;
}

function yShiftPixels(){
  // 現在の収集法はSpin warp。
  // オフレゾナンス位相はreadout方向(kx)だけに依存するため、
  // 位相エンコード方向の位置ずれは0 pixel。
  // EPI追加時には、ここを取得時刻配列から計算する。
  return 0;
}

function wrapCentered(value){
  const min = kMin();
  return ((value-min)%N+N)%N+min;
}

function phaseIdealFor(p,q,kx,ky){
  return -2*Math.PI*(p*kx + q*ky)/N;
}

function phaseActualFor(p,q,kx,ky){
  const shift = offResonanceShiftPixels();
  return -2*Math.PI*((p+shift)*kx + q*ky)/N;
}

function changeCoordinate(inputEl,delta){
  const currentValue = clampCentered(inputEl.value);
  const nextValue = Math.max(kMin(),Math.min(kMax(),currentValue+delta));
  if(nextValue === currentValue) return;
  inputEl.value = String(nextValue);
  // 取得済みのk空間ベクトルは残し、座標変更後の位相へ即時更新する。
  refreshStoredVectorPhases();
  runSelfTests();
  render();
}

function updateCoordinateButtons(){
  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);
  pMinusEl.disabled = p <= kMin();
  pPlusEl.disabled = p >= kMax();
  qMinusEl.disabled = q <= kMin();
  qPlusEl.disabled = q >= kMax();
}

function buildSequence(){
  const out = [];
  const xs = centeredValues();
  const kys = kyValues();

  kys.forEach((targetKy,index) => {
    const excitation = index + 1;

    // RF直後のk空間位置は原点。□を現在位置として表示する。
    out.push({
      stage:`RF励起：第${excitation}励起`,phase:"rf",excitation,
      kx:0,ky:0,targetKy,adc:false,gx:0,gy:0
    });

    // Gy印加中は、勾配の極性に対応して原点から目的kyへ1マスずつ移動する。
    // Gyの表示強度は目的位置までの総移動量 Δky に対応し、移動中は一定とする。
    const deltaKy = targetKy;
    if(deltaKy===0){
      out.push({
        stage:"Gy：Δky=0（移動なし）",phase:"gy",excitation,
        kx:0,ky:0,targetKy,adc:false,gx:0,gy:0
      });
    }else{
      const stepY = Math.sign(deltaKy);
      for(let cursorKy=stepY; stepY>0 ? cursorKy<=targetKy : cursorKy>=targetKy; cursorKy+=stepY){
        out.push({
          stage:`Gy：k=(0,${cursorKy})へ移動`,phase:"gy",excitation,
          kx:0,ky:cursorKy,targetKy,adc:false,gx:0,gy:deltaKy
        });
      }
    }

    // 負のGx prephaserで、(0,targetKy)から読出し開始点(kxmin,targetKy)へ左向きに移動する。
    for(let cursorKx=-1; cursorKx>=kMin(); cursorKx--){
      out.push({
        stage:`Gx pre：k=(${cursorKx},${targetKy})へ移動`,phase:"pre",excitation,
        kx:cursorKx,ky:targetKy,targetKy,adc:false,gx:-1,gy:0
      });
    }

    // 正のGx readoutで左端から右端へ移動し、各位置の位相ベクトルを取得する。
    xs.forEach(kx => {
      out.push({
        stage:"Gx readout：信号収集",phase:"readout",excitation,
        kx,ky:targetKy,targetKy,adc:true,gx:1,gy:0
      });
    });
    out.push({
      stage:`第${excitation}励起終了`,phase:"wait",excitation,
      kx:null,ky:null,targetKy,adc:false,gx:0,gy:0
    });
  });

  sequence = out;
  seqIndex = Math.min(seqIndex,sequence.length);
}

function clearCanvas(ctx){
  ctx.clearRect(0,0,500,520);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,500,520);
}

function drawGrid(ctx,top=42){
  const left = 64;
  const size = 384;
  const cell = size/N;

  ctx.strokeStyle = "#8f8f8f";
  ctx.lineWidth = 0.8;

  for(let i=0;i<=N;i++){
    const z = left+i*cell;

    ctx.beginPath();
    ctx.moveTo(z,top);
    ctx.lineTo(z,top+size);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(left,top+i*cell);
    ctx.lineTo(left+size,top+i*cell);
    ctx.stroke();
  }

  return {left,size,cell,top};
}

function labelAxes(ctx,g){
  ctx.fillStyle = "#222";
  ctx.font = N===16 ? "9px sans-serif" : "11px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  centeredValues().forEach(v => {
    const x = g.left+(v-kMin()+0.5)*g.cell;
    if(N===8 || v===kMin() || v===0 || v===kMax() || v%2===0){
      ctx.fillText(String(v),x,g.top+g.size+5);
    }
  });

  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  centeredValues().forEach(v => {
    const y = g.top+(kMax()-v+0.5)*g.cell;
    if(N===8 || v===kMin() || v===0 || v===kMax() || v%2===0){
      ctx.fillText(String(v),g.left-7,y);
    }
  });

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawArrow(ctx,cx,cy,angle,length,color,width=2){
  const ex = cx+length*Math.cos(angle);
  const ey = cy-length*Math.sin(angle);

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(ex,ey);
  ctx.stroke();

  const head = Math.min(5,length*0.36);
  const phi = Math.atan2(ey-cy,ex-cx);

  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-head*Math.cos(phi-Math.PI/6),ey-head*Math.sin(phi-Math.PI/6));
  ctx.lineTo(ex-head*Math.cos(phi+Math.PI/6),ey-head*Math.sin(phi+Math.PI/6));
  ctx.closePath();
  ctx.fill();
}

function reconstructionData(){
  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);
  const values = [];
  let maxMagnitude = 0;

  centeredValues().forEach(y => {
    centeredValues().forEach(x => {
      let re = 0;
      let im = 0;

      centeredValues().forEach(ky => {
        centeredValues().forEach(kx => {
          const angle =
            phaseActualFor(p,q,kx,ky)
            +2*Math.PI*(kx*x+ky*y)/N;
          re += Math.cos(angle);
          im += Math.sin(angle);
        });
      });

      const magnitude = Math.hypot(re,im)/(N*N);
      maxMagnitude = Math.max(maxMagnitude,magnitude);
      values.push({x,y,magnitude});
    });
  });

  const peaks = values
    .filter(v => Math.abs(v.magnitude-maxMagnitude)<1e-8)
    .map(v => ({x:v.x,y:v.y}));

  return {values,maxMagnitude,peaks};
}

function drawPeriodicApparentMarker(ctx,g,x,y){
  const baseX = g.left+(x-kMin()+0.5)*g.cell;
  const cy = g.top+(kMax()-y+0.5)*g.cell;
  const xs = [baseX,baseX-g.size,baseX+g.size];

  xs.forEach(cx => {
    if(cx>=g.left-2 && cx<=g.left+g.size+2){
      ctx.strokeStyle = "#d46a16";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx,cy,Math.max(7,g.cell*0.20),0,Math.PI*2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx-Math.max(5,g.cell*0.13),cy);
      ctx.lineTo(cx+Math.max(5,g.cell*0.13),cy);
      ctx.moveTo(cx,cy-Math.max(5,g.cell*0.13));
      ctx.lineTo(cx,cy+Math.max(5,g.cell*0.13));
      ctx.stroke();
    }
  });
}

function drawGradientWedge(ctx,orientation,value,label){
  const w=ctx.canvas.width, h=ctx.canvas.height;
  ctx.clearRect(0,0,w,h);

  const active=Math.abs(value)>1e-12;
  const maxValue=orientation==="vertical"
    ? Math.max(1,Math.abs(kMin()),Math.abs(kMax()))
    : 1;
  const magnitude=Math.min(1,Math.abs(value)/maxValue);
  const positive=value>0;

  // Polarity convention used only in this diagram:
  // red = positive field offset, blue = negative field offset.
  const plusColor="rgba(210,56,70,0.92)";
  const minusColor="rgba(40,84,165,0.92)";
  const outline="rgba(35,45,65,0.92)";
  const idle="rgba(145,155,170,0.42)";

  function fillTriangle(points,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(points[0][0],points[0][1]);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i][0],points[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle=outline;
    ctx.stroke();
  }

  function signText(text,x,y,fontSize){
    ctx.fillStyle="#fff";
    ctx.font=`900 ${fontSize}px sans-serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(text,x,y);
  }

  if(orientation==="vertical"){
    const top=3, bottom=h-3, cy=h/2;
    const centerX=w/2;
    const neck=Math.max(1.2,w*0.022);
    const maxHalf=Math.max(neck+2,w*0.46);
    // The horizontal run of each hypotenuse is exactly proportional to |Gy|.
    // Therefore the displayed slope magnitude is proportional to the gradient magnitude.
    const half=neck+(maxHalf-neck)*magnitude;

    if(active){
      // Positive Gy: upper side is + and lower side is −.
      // Negative Gy: the polarities are swapped. Geometry is rotated 180° as requested.
      const upperRight=positive;
      const upperColor=positive ? plusColor : minusColor;
      const lowerColor=positive ? minusColor : plusColor;

      if(upperRight){
        fillTriangle([[centerX-neck,top],[centerX+half,top],[centerX+neck,cy]],upperColor);
        fillTriangle([[centerX-neck,cy],[centerX-half,bottom],[centerX+neck,bottom]],lowerColor);
      }else{
        fillTriangle([[centerX-half,top],[centerX+neck,top],[centerX-neck,cy]],upperColor);
        fillTriangle([[centerX+neck,cy],[centerX-neck,bottom],[centerX+half,bottom]],lowerColor);
      }

      signText(positive?"+":"−",centerX,top+Math.max(11,w*0.22),Math.max(10,Math.round(w*0.20)));
      signText(positive?"−":"+",centerX,bottom-Math.max(11,w*0.22),Math.max(10,Math.round(w*0.20)));
    }else{
      ctx.strokeStyle=idle;
      ctx.lineWidth=Math.max(1,w*0.025);
      ctx.beginPath();
      ctx.moveTo(centerX,top);
      ctx.lineTo(centerX,bottom);
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(centerX,h/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle=active ? "rgba(255,255,255,.92)" : "#727985";
    ctx.font=`bold ${Math.max(9,Math.round(w*0.18))}px sans-serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(label,0,0);
    ctx.restore();
  }else{
    const left=3, right=w-3, cx=w/2;
    const centerY=h/2;
    const neck=Math.max(1.2,h*0.022);
    const maxHalf=Math.max(neck+2,h*0.46);
    // The vertical run of each hypotenuse is exactly proportional to |Gx|.
    const half=neck+(maxHalf-neck)*magnitude;

    if(active){
      // Positive Gx: right side is + and left side is −.
      // Negative Gx: the polarities are swapped.
      const leftDown=positive;
      const leftColor=positive ? minusColor : plusColor;
      const rightColor=positive ? plusColor : minusColor;

      if(leftDown){
        fillTriangle([[left,centerY-neck],[left,centerY+half],[cx,centerY+neck]],leftColor);
        fillTriangle([[cx,centerY-neck],[right,centerY-half],[right,centerY+neck]],rightColor);
      }else{
        fillTriangle([[left,centerY-half],[left,centerY+neck],[cx,centerY-neck]],leftColor);
        fillTriangle([[cx,centerY+neck],[right,centerY-neck],[right,centerY+half]],rightColor);
      }

      signText(positive?"−":"+",left+Math.max(13,h*0.34),centerY,Math.max(10,Math.round(h*0.28)));
      signText(positive?"+":"−",right-Math.max(13,h*0.34),centerY,Math.max(10,Math.round(h*0.28)));
    }else{
      ctx.strokeStyle=idle;
      ctx.lineWidth=Math.max(1,h*0.025);
      ctx.beginPath();
      ctx.moveTo(left,centerY);
      ctx.lineTo(right,centerY);
      ctx.stroke();
    }

    ctx.fillStyle=active ? "rgba(255,255,255,.92)" : "#727985";
    ctx.font=`bold ${Math.max(9,Math.round(h*0.25))}px sans-serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(label,w/2,centerY);
  }
}
function drawGradientsAndTimeline(){
  const gyScale = current.phase==="gy" ? current.gy : 0;
  const gxScale = (current.phase==="pre" || current.phase==="readout") ? current.gx : 0;
  drawGradientWedge(gyctx,"vertical",gyScale,"Gy");
  drawGradientWedge(gxctx,"horizontal",gxScale,"Gx");

  trSegments.forEach(seg=>{
    const order=["rf","gy","pre","readout","wait"];
    const now=order.indexOf(current.phase);
    const idx=order.indexOf(seg.dataset.phase);
    seg.classList.toggle("active",seg.dataset.phase===current.phase);
    seg.classList.toggle("done",current.excitation>0 && idx>=0 && now>=0 && idx<now);
  });
  realCardEl.classList.toggle("excitation-frame",current.phase!=="idle" && current.phase!=="wait");
  const total=N;
  const exc=current.excitation||1;
  const targetKy=current.targetKy!==undefined && current.targetKy!==null
    ? current.targetKy
    : kyValues()[Math.min(exc-1,kyValues().length-1)];
  excitationLabelEl.textContent=`第${exc}励起 / ${total}　ky = ${targetKy}`;
  gradientLabelEl.textContent=`Gx ${gxScale>0?"+":""}${formatNumber(gxScale,1)} ／ Gy ${gyScale>0?"+":""}${formatNumber(gyScale,1)}`;

  const xs=centeredValues();
  kxTrackEl.style.gridTemplateColumns=`repeat(${xs.length},minmax(0,1fr))`;
  kxTrackEl.classList.toggle("matrix16",N===16);
  kxTrackEl.innerHTML=xs.map(kx=>{
    let cls="tr-kx-cell";
    if(current.phase==="readout" && current.kx!==null){
      if(kx<current.kx) cls+=" done";
      if(kx===current.kx) cls+=" active";
    }else if(current.phase==="wait") cls+=" done";
    return `<div class="${cls}">${kx}</div>`;
  }).join("");
}

function drawReal(){
  clearCanvas(rctx);
  const g = drawGrid(rctx);
  const recon = reconstructionData();

  // 離散再構成像。整数pixelでなければ複数画素へ広がる。
  recon.values.forEach(v => {
    if(recon.maxMagnitude<=0) return;
    const relative = v.magnitude/recon.maxMagnitude;
    if(relative<0.015) return;

    const x = g.left+(v.x-kMin())*g.cell;
    const y = g.top+(kMax()-v.y)*g.cell;

    rctx.fillStyle = `rgba(212,106,22,${0.08+0.52*relative})`;
    rctx.fillRect(x+1,y+1,g.cell-2,g.cell-2);
  });

  labelAxes(rctx,g);

  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);
  const apparentX = wrapCentered(p+offResonanceShiftPixels());
  const apparentY = wrapCentered(q+yShiftPixels());

  // 真の位置
  const trueCx = g.left+(p-kMin()+0.5)*g.cell;
  const trueCy = g.top+(kMax()-q+0.5)*g.cell;

  rctx.fillStyle = "#24427d";
  rctx.beginPath();
  rctx.arc(trueCx,trueCy,Math.max(5,g.cell*0.16),0,Math.PI*2);
  rctx.fill();

  // 連続的な見かけ位置
  drawPeriodicApparentMarker(rctx,g,apparentX,apparentY);

  // 離散再構成の最大画素
  recon.peaks.forEach(peak => {
    const x = g.left+(peak.x-kMin())*g.cell;
    const y = g.top+(kMax()-peak.y)*g.cell;
    rctx.strokeStyle = "#d46a16";
    rctx.lineWidth = 1.5;
    rctx.strokeRect(x+2,y+2,g.cell-4,g.cell-4);
  });

  // 凡例は左右に分け、文字が重ならないよう配置する。
  rctx.font = "11px sans-serif";
  rctx.textBaseline = "middle";
  rctx.fillStyle = "#24427d";
  rctx.textAlign = "left";
  rctx.fillText("● 真の位置",g.left,g.top+g.size+55);
  rctx.fillStyle = "#d46a16";
  rctx.textAlign = "right";
  rctx.fillText("○ 見かけの位置",g.left+g.size,g.top+g.size+55);
  rctx.textAlign = "left";
  rctx.textBaseline = "alphabetic";
}

function drawKspace(){
  clearCanvas(kctx);
  const g = drawGrid(kctx);
  labelAxes(kctx,g);

  centeredValues().forEach(ky => {
    centeredValues().forEach(kx => {
      const cx = g.left+(kx-kMin()+0.5)*g.cell;
      const cy = g.top+(kMax()-ky+0.5)*g.cell;
      const rec = vectors.get(`${kx},${ky}`);

      if(rec){
        drawArrow(
          kctx,
          cx,
          cy,
          rec.actual,
          Math.max(7,g.cell*0.31),
          "#24427d",
          N===16 ? 1.35 : 2.1
        );

        kctx.fillStyle = "#24427d";
        kctx.beginPath();
        kctx.arc(cx,cy,N===16 ? 1.2 : 2.0,0,Math.PI*2);
        kctx.fill();
      }else{
        kctx.fillStyle = "#c7ccd5";
        kctx.beginPath();
        kctx.arc(cx,cy,N===16 ? 0.8 : 1.3,0,Math.PI*2);
        kctx.fill();
      }
    });
  });

  if(current.kx!==null && current.ky!==null){
    const cx = g.left+(current.kx-kMin()+0.5)*g.cell;
    const cy = g.top+(kMax()-current.ky+0.5)*g.cell;

    kctx.strokeStyle = "#d63849";
    kctx.lineWidth = 2;
    kctx.strokeRect(
      cx-g.cell*0.43,
      cy-g.cell*0.43,
      g.cell*0.86,
      g.cell*0.86
    );
  }


}

function storeVector(event){
  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);

  vectors.set(`${event.kx},${event.ky}`,{
    ideal:phaseIdealFor(p,q,event.kx,event.ky),
    actual:phaseActualFor(p,q,event.kx,event.ky)
  });
}

function fillAll(){
  stop();
  vectors.clear();

  centeredValues().forEach(ky => {
    centeredValues().forEach(kx => storeVector({kx,ky}));
  });

  current = {stage:"全マス表示",phase:"idle",excitation:0,kx:null,ky:null,targetKy:null,adc:false,gx:0,gy:0};
  seqIndex = sequence.length;
  render();
}

function formatNumber(value,digits=3){
  const rounded = Number(value.toFixed(digits));
  return Object.is(rounded,-0) ? "0" : String(rounded);
}

function formatSigned(value,digits=3){
  const text = formatNumber(value,digits);
  if(text==="0") return "0";
  return value>0 ? `+${text}` : text;
}

function peakText(peaks){
  if(peaks.length===0) return "—";
  return peaks.map(v => `(${v.x},${v.y})`).join(" / ");
}

function normalizeAngle(angle){
  let a = angle%(2*Math.PI);
  if(a<0) a += 2*Math.PI;
  return a;
}

function angleClose(a,b,tol=1e-9){
  const d = Math.abs(normalizeAngle(a)-normalizeAngle(b));
  return Math.min(d,2*Math.PI-d)<tol;
}

function runSelfTests(){
  const errors = [];
  const oldN = N;
  const oldDf = dfEl.value;
  const oldBw = bandwidthEl.value;
  const oldEnabled = offResonanceEnabled;

  N = 8;
  offResonanceEnabled = true;
  dfEl.value = "0";
  bandwidthEl.value = "double";

  for(let p=-4;p<=3;p++){
    for(let q=-4;q<=3;q++){
      if(!angleClose(phaseIdealFor(p,q,0,0),0)){
        errors.push(`k=(0,0)異常：(${p},${q})`);
      }
    }
  }

  const expectedKxDeg = [180,135,90,45,0,-45,-90,-135];
  centeredValues().forEach((kx,i) => {
    if(!angleClose(
      phaseIdealFor(1,2,kx,0),
      expectedKxDeg[i]*Math.PI/180
    )){
      errors.push(`(1,2) kx=${kx}の向き異常`);
    }
  });

  const expectedKyDeg = [0,-90,180,90,0,-90,180,90];
  centeredValues().forEach((ky,i) => {
    if(!angleClose(
      phaseIdealFor(1,2,0,ky),
      expectedKyDeg[i]*Math.PI/180
    )){
      errors.push(`(1,2) ky=${ky}の向き異常`);
    }
  });

  // Δf=125 Hz：2倍BWでは1 pixel、基準BWでは2 pixel。
  dfEl.value = "125";
  bandwidthEl.value = "double";
  if(Math.abs(offResonanceShiftPixels()-1)>1e-12){
    errors.push("2倍BWの位置ずれ異常");
  }

  bandwidthEl.value = "standard";
  if(Math.abs(offResonanceShiftPixels()-2)>1e-12){
    errors.push("基準BWの位置ずれ異常");
  }

  // Spin warpではオフレゾナンス後もky隣接位相差は不変。
  for(const df of [-250,-125,0,125,250]){
    dfEl.value = String(df);
    for(const bw of ["double","standard"]){
      bandwidthEl.value = bw;
      for(const kx of centeredValues()){
        for(let ky=-4;ky<3;ky++){
          const idealDifference =
            phaseIdealFor(1,2,kx,ky+1)-phaseIdealFor(1,2,kx,ky);
          const actualDifference =
            phaseActualFor(1,2,kx,ky+1)-phaseActualFor(1,2,kx,ky);

          if(!angleClose(idealDifference,actualDifference)){
            errors.push(`ky不変性異常：Δf=${df}, BW=${bw}`);
          }
        }
      }
    }
  }

  // Spin warpではy方向位置ずれは常に0。
  for(const df of [-250,-125,0,125,250]){
    dfEl.value = String(df);
    if(Math.abs(yShiftPixels())>1e-12){
      errors.push(`Spin warp y位置ずれ異常：Δf=${df}`);
    }
  }

  // FOV端でのwrap確認：p=3、+2 pixel → -3。
  dfEl.value = "125";
  bandwidthEl.value = "standard";
  if(Math.abs(wrapCentered(3+offResonanceShiftPixels())-(-3))>1e-12){
    errors.push("FOV wrap異常");
  }

  // k空間カーソルの移動方向を検算する。
  buildSequence();
  const firstExc = sequence.filter(e=>e.excitation===1);
  const gyEvents = firstExc.filter(e=>e.phase==="gy");
  const preEvents = firstExc.filter(e=>e.phase==="pre");
  const readEvents = firstExc.filter(e=>e.phase==="readout");
  const targetKy = kyValues()[0];
  if(gyEvents.length && gyEvents.at(-1).ky!==targetKy){
    errors.push("Gyカーソル終点異常");
  }
  if(preEvents.length && !(preEvents[0].kx===-1 && preEvents.at(-1).kx===kMin())){
    errors.push("Gx pre移動方向異常");
  }
  if(readEvents.length && !(readEvents[0].kx===kMin() && readEvents.at(-1).kx===kMax())){
    errors.push("Gx readout移動方向異常");
  }

  N = oldN;
  dfEl.value = oldDf;
  bandwidthEl.value = oldBw;
  offResonanceEnabled = oldEnabled;
  buildSequence();

  if(errors.length===0){
    testboxEl.className = "testbox";
    testboxEl.textContent =
      "内部検算：OK｜座標、位相ベクトル、Gy縦移動、Gx pre左移動、readout右移動、x位置ずれ、y位置ずれ0、FOV wrapを確認。";
  }else{
    testboxEl.className = "testbox error";
    testboxEl.textContent = `内部検算：NG｜${errors.slice(0,4).join("／")}`;
  }
}

function playbackDelayMs(){
  // スライダーは右ほど速い。値が大きいほど待ち時間を短くする。
  return 220 - Number(speedEl.value)*20;
}

function render(){
  updateCoordinateButtons();
  drawReal();
  drawKspace();
  drawGradientsAndTimeline();

  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);
  const df = offResonanceHz();
  const shift = offResonanceShiftPixels();
  const yShift = yShiftPixels();
  const apparentX = wrapCentered(p+shift);
  const apparentY = wrapCentered(q+yShift);
  const recon = reconstructionData();

  const hasOffResonance = offResonanceEnabled;
  document.body.classList.toggle("offres-on",hasOffResonance);
  offresStatusEl.className = `status-badge ${hasOffResonance ? "on" : "off"}`;
  offresStatusEl.textContent = hasOffResonance
    ? `オフレゾナンスあり　${formatSigned(df,1)} Hz`
    : "オフレゾナンスなし";
  offresOffEl.className = hasOffResonance ? "" : "active-off";
  offresOnEl.className = hasOffResonance ? "active-on" : "";
  dfEl.disabled = !hasOffResonance;
  dfMinusEl.disabled = !hasOffResonance || Number(dfEl.value) <= Number(dfEl.min);
  dfPlusEl.disabled = !hasOffResonance || Number(dfEl.value) >= Number(dfEl.max);
  speedMinusEl.disabled = Number(speedEl.value) <= Number(speedEl.min);
  speedPlusEl.disabled = Number(speedEl.value) >= Number(speedEl.max);
  dfSettingEl.classList.toggle("disabled",!hasOffResonance);

  xyEl.textContent = `(${p},${q})`;
  cyclesEl.textContent = `kx ${p} / ky ${q}`;
  dfReadEl.textContent = `${formatSigned(df,1)} Hz`;
  readoutReadEl.textContent = `${readoutMs()} ms`;
  shiftReadEl.textContent = `${formatSigned(shift,2)} pixel`;
  yShiftReadEl.textContent = `${formatSigned(yShift,2)} pixel`;
  apparentReadEl.textContent =
    `(${formatNumber(apparentX,2)},${formatNumber(apparentY,2)})`;
  stageEl.textContent = current.stage;

  explainEl.textContent =
    `左の楔はGy、下の楔はGxです。斜辺の傾きが勾配強度に比例し、赤は＋、青は−の磁場偏位を示します。1回の励起はRFから次のRF直前までで、□は現在のk空間位置です。RFでは原点、Gyでは縦方向、Gx preでは左方向へ移動し、Gx readout中は右へ進みながら位相ベクトルを書き込みます。`+
    ` 入力は収集法に依存しないオフレゾナンス Δf としました。`+
    ` Spin warpでは x位置ずれ = Δf × readout時間 = ${formatSigned(shift,2)} pixel。`+
    ` 現在の符号規約では正のΔfは＋x方向へ移動し、FOV外へ出ると反対側へwrapします。`+
    ` 見かけの位置は(${formatNumber(apparentX,2)},${formatNumber(apparentY,2)})、離散再構成の最大画素は${peakText(recon.peaks)}です。`;

  if(Math.abs(shift-Math.round(shift))>1e-9){
    explainEl.textContent +=
      " 位置ずれが非整数pixelなので、再構成信号は複数画素へ広がります。";
  }

  explainEl.textContent +=
    ` ky項は変わらないため、Spin warpではy位置ずれは${formatSigned(yShift,2)} pixelで、ky方向のサイクル数も不変です。`;

  if(showCheckDetails){
    explainEl.textContent +=
      " 検算：(1,2)のky=0行はkx=−4→3で ←,↖,↑,↗,→,↘,↓,↙。"+
      " kx=0列はky=−4→3で →,↓,←,↑,→,↓,←,↑。";
  }
}

function advance(){
  if(seqIndex>=sequence.length){
    stop();
    current = {stage:"完了",phase:"idle",excitation:N,kx:null,ky:null,targetKy:null,adc:false,gx:0,gy:0};
    render();
    return;
  }

  current = sequence[seqIndex];

  if(current.adc) storeVector(current);

  seqIndex++;
  render();
}

function stop(){
  if(timer){
    clearInterval(timer);
    timer = null;
  }
  playBtn.textContent = "実行";
}

function reset(){
  stop();
  if(phaseCompareTimer) clearTimeout(phaseCompareTimer);
  phaseCompareTimer = null;
  previousVectorPhases = null;
  vectors.clear();
  seqIndex = 0;
  current = {stage:"待機",phase:"idle",excitation:0,kx:null,ky:null,targetKy:null,adc:false,gx:0,gy:0};
  buildSequence();
  runSelfTests();
  render();
}

matrixEl.addEventListener("change",() => {
  N = Number(matrixEl.value);
  pEl.min = String(kMin());
  pEl.max = String(kMax());
  qEl.min = String(kMin());
  qEl.max = String(kMax());
  pEl.value = String(clampCentered(pEl.value));
  qEl.value = String(clampCentered(qEl.value));
  reset();
});

kyorderEl.addEventListener("input",reset);
bandwidthEl.addEventListener("input",() => {
  refreshStoredVectorPhases();
  runSelfTests();
  render();
});

function changePlaybackSpeed(delta){
  const next = Math.max(Number(speedEl.min),Math.min(Number(speedEl.max),Number(speedEl.value)+delta));
  if(next === Number(speedEl.value)) return;
  speedEl.value = String(next);
  if(timer){
    clearInterval(timer);
    timer = setInterval(advance,playbackDelayMs());
  }
  render();
}

function changeOffResonanceFrequency(delta){
  if(!offResonanceEnabled) return;
  const next = Math.max(Number(dfEl.min),Math.min(Number(dfEl.max),Number(dfEl.value)+delta));
  if(Math.abs(next-Number(dfEl.value)) < 1e-12) return;

  dfEl.value = String(next);
  if(Math.abs(next) > 1e-12) lastNonzeroDf = next;
  refreshStoredVectorPhases();
  runSelfTests();
  render();
}

speedMinusEl.addEventListener("click",() => changePlaybackSpeed(-1));
speedPlusEl.addEventListener("click",() => changePlaybackSpeed(1));
dfMinusEl.addEventListener("click",() => changeOffResonanceFrequency(-Number(dfEl.step)));
dfPlusEl.addEventListener("click",() => changeOffResonanceFrequency(Number(dfEl.step)));

offresOffEl.addEventListener("click",() => setOffResonanceEnabled(false));
offresOnEl.addEventListener("click",() => setOffResonanceEnabled(true));

pMinusEl.addEventListener("click",() => changeCoordinate(pEl,-1));
pPlusEl.addEventListener("click",() => changeCoordinate(pEl,1));
qMinusEl.addEventListener("click",() => changeCoordinate(qEl,-1));
qPlusEl.addEventListener("click",() => changeCoordinate(qEl,1));

playBtn.addEventListener("click",() => {
  if(timer){
    stop();
    return;
  }

  playBtn.textContent = "一時停止";
  timer = setInterval(advance,playbackDelayMs());
});

document.getElementById("step").addEventListener("click",() => {
  stop();
  advance();
});

document.getElementById("reset").addEventListener("click",reset);
document.getElementById("fill").addEventListener("click",fillAll);

document.getElementById("showCheck").addEventListener("click",() => {
  showCheckDetails = !showCheckDetails;
  render();
});

real.addEventListener("pointerdown",event => {
  const rect = real.getBoundingClientRect();
  const scale = real.width/rect.width;
  const px = (event.clientX-rect.left)*scale;
  const py = (event.clientY-rect.top)*scale;

  const left = 64;
  const top = 42;
  const size = 384;
  const cell = size/N;

  const ix = Math.floor((px-left)/cell);
  const iy = Math.floor((py-top)/cell);

  if(ix<0 || ix>=N || iy<0 || iy>=N) return;

  pEl.value = String(kMin()+ix);
  qEl.value = String(kMax()-iy);
  refreshStoredVectorPhases();
  runSelfTests();
  render();
});

buildSequence();
runSelfTests();
render();
})();
</script>
</body>
</html>
