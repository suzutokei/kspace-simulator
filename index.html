<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>k-space Phase Vector Simulator</title>
<style>
:root{
  --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#666;
  --blue:#24427d; --red:#d63849; --green:#196c35; --warn:#8a4b00;
}
*{box-sizing:border-box}
html,body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif
}
.app{max-width:1060px;margin:auto;padding:8px 6px 24px}
h1{font-size:18px;margin:3px 2px}
header p{font-size:11px;color:var(--muted);margin:0 2px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.panel h2{text-align:center;font-size:17px;margin:6px 0}
.card,.controls{background:#fff;border:1px solid #ddd;border-radius:11px}
.card{padding:4px}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{margin-top:8px;padding:9px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
label{font-size:11px;font-weight:700}
.value{display:block;margin-top:3px;font-weight:600;color:#333}
input,select,button{
  width:100%;min-height:39px;border:1px solid #aaa;border-radius:9px;
  background:#fff;font:inherit;padding:7px
}
button{font-weight:800}
button.primary{background:#111;color:#fff}
.readout{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.readout div{
  border:1px solid #ddd;border-radius:8px;background:#fafafa;
  text-align:center;padding:6px 2px;font-size:10px
}
.readout b{display:block;font-size:12px;margin-top:2px}
.explain,.testbox{
  margin-top:7px;border-radius:8px;padding:8px;font-size:12px;line-height:1.5
}
.explain{background:#fff7da;border:1px solid #eadb99}
.testbox{background:#eef8f0;border:1px solid #b9d8bf;color:var(--green)}
.testbox.error{background:#fff0ed;border-color:#e2b4aa;color:#8a1f11}
@media(max-width:650px){
  h1{font-size:15px}
  .panel h2{font-size:15px}
  .row{grid-template-columns:repeat(2,1fr)}
  .readout{grid-template-columns:repeat(4,1fr)}
  .readout div{font-size:9px}
  .readout b{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>k-space Phase Vector Simulator</h1>
  <p>座標系：8×8では左下 (−4,−4)、右上 (3,3)。0°のベクトルは →。</p>
</header>

<main class="two">
  <section class="panel">
    <h2>実空間</h2>
    <div class="card"><canvas id="real" width="480" height="500"></canvas></div>
  </section>
  <section class="panel">
    <h2>k空間</h2>
    <div class="card"><canvas id="kspace" width="480" height="500"></canvas></div>
  </section>
</main>

<section class="controls">
  <div class="row">
    <label>マトリクス
      <select id="matrix">
        <option value="8">8 × 8</option>
        <option value="16">16 × 16</option>
      </select>
    </label>

    <label>実空間 x = p
      <input id="p" type="number" min="-4" max="3" value="1">
    </label>

    <label>実空間 y = q
      <input id="q" type="number" min="-4" max="3" value="2">
    </label>

    <label>収集方法
      <select id="method">
        <option value="spinwarp">Spin warp</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>ky収集順
      <select id="kyorder">
        <option value="centerout">0,+1,−1,+2,−2…</option>
        <option value="linear">−端 → ＋端</option>
        <option value="centric">0,−1,+1,−2,+2…</option>
      </select>
    </label>

    <label>受信バンド幅
      <select id="bandwidth">
        <option value="double">2倍受信BW（readout 8 ms）</option>
        <option value="standard">基準受信BW（readout 16 ms）</option>
      </select>
    </label>

    <label>オフレゾナンス位相ランプ
      <input id="shift" type="range" min="-2" max="2" step="0.5" value="0">
      <span class="value" id="shiftValue">0 cycle</span>
    </label>

    <label>速度
      <input id="speed" type="range" min="20" max="180" step="10" value="70">
    </label>
  </div>

  <div class="row">
    <button id="play" class="primary">実行</button>
    <button id="step">1段階進める</button>
    <button id="pause">一時停止</button>
    <button id="reset">リセット</button>
  </div>

  <div class="row">
    <button id="fill">全マス表示</button>
    <button id="togglePhase">オフレゾナンスなし表示</button>
    <button id="clear">k空間消去</button>
    <button id="showCheck">検算詳細</button>
  </div>

  <div class="readout">
    <div>実空間点<b id="xy">(1,2)</b></div>
    <div>理想 kx周期<b id="cx">1</b></div>
    <div>理想 ky周期<b id="cy">2</b></div>
    <div>追加 kx周期<b id="shiftRead">0</b></div>
    <div>合計 kx周期<b id="totalX">1</b></div>
    <div>Δf<b id="dfRead">0 Hz</b></div>
    <div>段階<b id="stage">待機</b></div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="testbox" id="testbox">内部検算を実行中…</div>
</section>
</div>

<script>
(() => {
"use strict";

const READOUT_MS = {
  double: 8,
  standard: 16
};

const real = document.getElementById("real");
const kspace = document.getElementById("kspace");
const rctx = real.getContext("2d");
const kctx = kspace.getContext("2d");

const matrixEl = document.getElementById("matrix");
const pEl = document.getElementById("p");
const qEl = document.getElementById("q");
const kyorderEl = document.getElementById("kyorder");
const bandwidthEl = document.getElementById("bandwidth");
const shiftEl = document.getElementById("shift");
const speedEl = document.getElementById("speed");

const shiftValueEl = document.getElementById("shiftValue");
const xyEl = document.getElementById("xy");
const cxEl = document.getElementById("cx");
const cyEl = document.getElementById("cy");
const shiftReadEl = document.getElementById("shiftRead");
const totalXEl = document.getElementById("totalX");
const dfReadEl = document.getElementById("dfRead");
const stageEl = document.getElementById("stage");
const explainEl = document.getElementById("explain");
const testboxEl = document.getElementById("testbox");
const playBtn = document.getElementById("play");

let N = 8;
let sequence = [];
let seqIndex = 0;
let timer = null;
let vectors = new Map();
let showIdeal = false;
let showCheckDetails = false;
let current = {stage:"待機", kx:null, ky:null, adc:false};

function kMin(){ return -N/2; }
function kMax(){ return N/2-1; }

function clampCentered(value){
  const v = Math.round(Number(value) || 0);
  return Math.max(kMin(), Math.min(kMax(), v));
}

function centeredValues(){
  const out = [];
  for(let v=kMin(); v<=kMax(); v++) out.push(v);
  return out;
}

function kyValues(){
  if(kyorderEl.value === "linear") return centeredValues();

  const out = [0];
  for(let d=1; out.length<N; d++){
    if(kyorderEl.value === "centric"){
      if(-d >= kMin()) out.push(-d);
      if(out.length<N && d <= kMax()) out.push(d);
    }else{
      if(d <= kMax()) out.push(d);
      if(out.length<N && -d >= kMin()) out.push(-d);
    }
  }
  return out;
}

function readoutMs(){
  return READOUT_MS[bandwidthEl.value];
}

function shiftCycles(){
  return Number(shiftEl.value);
}

function offResonanceHz(){
  return shiftCycles() * 1000 / readoutMs();
}

/*
  位相規約（元アニメに合わせる）：
    φideal = -2π (p kx + q ky) / N

  Spin warpのオフレゾナンス：
    soff = Δf × Treadout [cycle]
    φoff = -2π soff kx / N

  よって：
    φactual = -2π { (p + soff)kx + qky } / N

  0 radは右向き。正の数学的角度は反時計回りに描画する。
*/
function phaseIdealFor(p,q,kx,ky){
  return -2*Math.PI*(p*kx + q*ky)/N;
}

function phaseActualFor(p,q,kx,ky){
  return -2*Math.PI*((p + shiftCycles())*kx + q*ky)/N;
}

function buildSequence(){
  const out = [];
  const xs = centeredValues();

  kyValues().forEach(ky => {
    out.push({stage:`Gy位相エンコード：ky=${ky}`,kx:null,ky,adc:false});
    out.push({stage:"Gx負のprephaser",kx:kMin(),ky,adc:false});

    xs.forEach(kx => {
      out.push({stage:"Gx正：信号収集",kx,ky,adc:true});
    });
  });

  sequence = out;
  seqIndex = Math.min(seqIndex, sequence.length);
}

function clearCanvas(ctx){
  ctx.clearRect(0,0,480,500);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,480,500);
}

function drawGrid(ctx,top=42){
  const left = 54;
  const size = 384;
  const cell = size/N;

  ctx.strokeStyle = "#8f8f8f";
  ctx.lineWidth = 0.8;

  for(let i=0; i<=N; i++){
    const z = left+i*cell;

    ctx.beginPath();
    ctx.moveTo(z,top);
    ctx.lineTo(z,top+size);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(left,top+i*cell);
    ctx.lineTo(left+size,top+i*cell);
    ctx.stroke();
  }

  return {left,size,cell,top};
}

function drawArrow(ctx,cx,cy,angle,length,color,width=2){
  const ex = cx + length*Math.cos(angle);
  const ey = cy - length*Math.sin(angle);

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(ex,ey);
  ctx.stroke();

  const head = Math.min(5,length*0.36);
  const phi = Math.atan2(ey-cy,ex-cx);

  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(
    ex-head*Math.cos(phi-Math.PI/6),
    ey-head*Math.sin(phi-Math.PI/6)
  );
  ctx.lineTo(
    ex-head*Math.cos(phi+Math.PI/6),
    ey-head*Math.sin(phi+Math.PI/6)
  );
  ctx.closePath();
  ctx.fill();
}

function labelAxes(ctx,g){
  ctx.fillStyle = "#222";
  ctx.font = N===16 ? "9px sans-serif" : "11px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  centeredValues().forEach(v => {
    const x = g.left+(v-kMin()+0.5)*g.cell;
    if(N===8 || v===kMin() || v===0 || v===kMax() || v%2===0){
      ctx.fillText(String(v),x,g.top+g.size+5);
    }
  });

  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  centeredValues().forEach(v => {
    const y = g.top+(kMax()-v+0.5)*g.cell;
    if(N===8 || v===kMin() || v===0 || v===kMax() || v%2===0){
      ctx.fillText(String(v),g.left-6,y);
    }
  });

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawReal(){
  clearCanvas(rctx);
  const g = drawGrid(rctx);
  labelAxes(rctx,g);

  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);

  const cx = g.left+(p-kMin()+0.5)*g.cell;
  const cy = g.top+(kMax()-q+0.5)*g.cell;

  rctx.fillStyle = "#24427d";
  rctx.beginPath();
  rctx.arc(cx,cy,Math.max(5,g.cell*0.16),0,Math.PI*2);
  rctx.fill();

  drawArrow(rctx,cx,cy,0,Math.max(12,g.cell*0.32),"#d63849",3);

  rctx.fillStyle = "#111";
  rctx.font = "13px sans-serif";
  rctx.fillText(`(${p},${q})`,cx+8,cy-7);

  rctx.font = "11px sans-serif";
  rctx.fillText(`左下 (${kMin()},${kMin()})`,g.left,g.top+g.size+42);
  rctx.textAlign = "right";
  rctx.fillText(`右上 (${kMax()},${kMax()})`,g.left+g.size,g.top-10);
  rctx.textAlign = "left";
}

function drawKspace(){
  clearCanvas(kctx);
  const g = drawGrid(kctx);
  labelAxes(kctx,g);

  centeredValues().forEach(ky => {
    centeredValues().forEach(kx => {
      const cx = g.left+(kx-kMin()+0.5)*g.cell;
      const cy = g.top+(kMax()-ky+0.5)*g.cell;
      const rec = vectors.get(`${kx},${ky}`);

      if(rec){
        const angle = showIdeal ? rec.ideal : rec.actual;
        drawArrow(
          kctx,cx,cy,angle,
          Math.max(7,g.cell*0.31),
          "#24427d",
          N===16 ? 1.35 : 2.1
        );
        kctx.fillStyle = "#24427d";
        kctx.beginPath();
        kctx.arc(cx,cy,N===16 ? 1.2 : 2.0,0,Math.PI*2);
        kctx.fill();
      }else{
        kctx.fillStyle = "#c7ccd5";
        kctx.beginPath();
        kctx.arc(cx,cy,N===16 ? 0.8 : 1.3,0,Math.PI*2);
        kctx.fill();
      }
    });
  });

  if(current.kx !== null && current.ky !== null){
    const cx = g.left+(current.kx-kMin()+0.5)*g.cell;
    const cy = g.top+(kMax()-current.ky+0.5)*g.cell;

    kctx.strokeStyle = "#d63849";
    kctx.lineWidth = 2;
    kctx.strokeRect(
      cx-g.cell*0.43,
      cy-g.cell*0.43,
      g.cell*0.86,
      g.cell*0.86
    );
  }

  kctx.fillStyle = "#111";
  kctx.font = "11px sans-serif";
  kctx.fillText(`左下 (${kMin()},${kMin()})`,g.left,g.top+g.size+42);
  kctx.textAlign = "right";
  kctx.fillText(`右上 (${kMax()},${kMax()})`,g.left+g.size,g.top-10);
  kctx.textAlign = "left";
}

function storeVector(event){
  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);

  vectors.set(`${event.kx},${event.ky}`,{
    ideal: phaseIdealFor(p,q,event.kx,event.ky),
    actual: phaseActualFor(p,q,event.kx,event.ky)
  });
}

function fillAll(){
  stop();
  vectors.clear();

  centeredValues().forEach(ky => {
    centeredValues().forEach(kx => {
      storeVector({kx,ky});
    });
  });

  current = {stage:"全マス表示",kx:null,ky:null,adc:false};
  seqIndex = sequence.length;
  render();
}

function formatSigned(value){
  if(Math.abs(value)<1e-12) return "0";
  return value>0 ? `+${value}` : String(value);
}

function configureShiftSlider(preserveDf=null){
  const isDouble = bandwidthEl.value === "double";
  const min = isDouble ? -2 : -4;
  const max = isDouble ?  2 :  4;
  const step = isDouble ? 0.5 : 1;

  shiftEl.min = String(min);
  shiftEl.max = String(max);
  shiftEl.step = String(step);

  if(preserveDf !== null){
    const raw = preserveDf*readoutMs()/1000;
    const rounded = Math.round(raw/step)*step;
    shiftEl.value = String(Math.max(min,Math.min(max,rounded)));
  }else{
    const raw = Number(shiftEl.value);
    const rounded = Math.round(raw/step)*step;
    shiftEl.value = String(Math.max(min,Math.min(max,rounded)));
  }
}

function normalizeAngle(angle){
  let a = angle%(2*Math.PI);
  if(a<0) a += 2*Math.PI;
  return a;
}

function angleClose(a,b,tol=1e-9){
  const d = Math.abs(normalizeAngle(a)-normalizeAngle(b));
  return Math.min(d,2*Math.PI-d)<tol;
}

function runSelfTests(){
  const errors = [];
  const oldN = N;
  const oldShift = shiftEl.value;

  N = 8;
  shiftEl.value = "0";

  // 全実空間位置について、k=(0,0)は必ず→。
  for(let p=-4;p<=3;p++){
    for(let q=-4;q<=3;q++){
      if(!angleClose(phaseIdealFor(p,q,0,0),0)){
        errors.push(`中心ベクトル異常：(${p},${q})`);
      }
    }
  }

  // (1,2), ky=0：← ↖ ↑ ↗ → ↘ ↓ ↙
  const expectedKxDeg = [180,135,90,45,0,-45,-90,-135];
  centeredValues().forEach((kx,i) => {
    const expected = expectedKxDeg[i]*Math.PI/180;
    if(!angleClose(phaseIdealFor(1,2,kx,0),expected)){
      errors.push(`(1,2) kx=${kx} の向き異常`);
    }
  });

  // (1,2), kx=0：→ ↓ ← ↑ → ↓ ← ↑
  const expectedKyDeg = [0,-90,180,90,0,-90,180,90];
  centeredValues().forEach((ky,i) => {
    const expected = expectedKyDeg[i]*Math.PI/180;
    if(!angleClose(phaseIdealFor(1,2,0,ky),expected)){
      errors.push(`(1,2) ky=${ky} の向き異常`);
    }
  });

  // オフレゾナンスを加えてもky隣接位相差は不変。
  for(const s of [-2,-1,0,0.5,2]){
    shiftEl.value = String(s);
    for(const kx of centeredValues()){
      for(let ky=-4;ky<3;ky++){
        const dIdeal =
          phaseIdealFor(1,2,kx,ky+1)-phaseIdealFor(1,2,kx,ky);
        const dActual =
          phaseActualFor(1,2,kx,ky+1)-phaseActualFor(1,2,kx,ky);
        if(!angleClose(dIdeal,dActual)){
          errors.push(`ky不変性異常：shift=${s}, kx=${kx}, ky=${ky}`);
        }
      }
    }
  }

  N = oldN;
  shiftEl.value = oldShift;

  if(errors.length===0){
    testboxEl.className = "testbox";
    testboxEl.textContent =
      "内部検算：OK｜座標範囲、k=(0,0)の→、(1,2)のkx 1周期・ky 2周期、Spin warpでのky周期不変を確認。";
  }else{
    testboxEl.className = "testbox error";
    testboxEl.textContent = `内部検算：NG｜${errors.slice(0,4).join("／")}`;
  }
}

function render(){
  drawReal();
  drawKspace();

  const p = clampCentered(pEl.value);
  const q = clampCentered(qEl.value);
  const s = shiftCycles();
  const total = p+s;
  const df = offResonanceHz();

  xyEl.textContent = `(${p},${q})`;
  cxEl.textContent = String(p);
  cyEl.textContent = String(q);
  shiftReadEl.textContent = formatSigned(s);
  totalXEl.textContent = formatSigned(total);
  dfReadEl.textContent = `${formatSigned(Number(df.toFixed(1)))} Hz`;
  stageEl.textContent = current.stage;
  shiftValueEl.textContent =
    `${formatSigned(s)} cycle（＋はpと同方向）`;

  explainEl.textContent =
    `位相は φ = −2π{(p+s)kx + qky}/N。`+
    `実空間(${p},${q})の理想成分はkx方向${Math.abs(p)}周期、ky方向${Math.abs(q)}周期です。`+
    `s=${formatSigned(s)}はSpin warpのオフレゾナンスによるkx位相ランプで、ky項を含まないためky方向の周期数は変わりません。`+
    `現在の受信BWは${bandwidthEl.value==="double" ? "2倍" : "基準"}、readout時間${readoutMs()} msです。`;

  if(showCheckDetails){
    explainEl.textContent +=
      ` 検算例：(1,2)のky=0行は、kx=−4→3で ←,↖,↑,↗,→,↘,↓,↙。`+
      ` kx=0列は、ky=−4→3で →,↓,←,↑,→,↓,←,↑。`;
  }
}

function advance(){
  if(seqIndex>=sequence.length){
    stop();
    current = {stage:"完了",kx:null,ky:null,adc:false};
    render();
    return;
  }

  current = sequence[seqIndex];

  if(current.adc){
    storeVector(current);
  }

  seqIndex++;
  render();
}

function stop(){
  if(timer){
    clearInterval(timer);
    timer = null;
  }
  playBtn.textContent = "実行";
}

function reset(){
  stop();
  vectors.clear();
  seqIndex = 0;
  current = {stage:"待機",kx:null,ky:null,adc:false};
  buildSequence();
  runSelfTests();
  render();
}

matrixEl.addEventListener("change",() => {
  N = Number(matrixEl.value);
  pEl.min = String(kMin());
  pEl.max = String(kMax());
  qEl.min = String(kMin());
  qEl.max = String(kMax());
  pEl.value = String(clampCentered(pEl.value));
  qEl.value = String(clampCentered(qEl.value));
  reset();
});

[pEl,qEl,kyorderEl,shiftEl,speedEl].forEach(el => {
  el.addEventListener("input",reset);
});

let previousBandwidth = bandwidthEl.value;
bandwidthEl.addEventListener("change",() => {
  const previousReadout = READOUT_MS[previousBandwidth];
  const preservedDf = Number(shiftEl.value)*1000/previousReadout;

  configureShiftSlider(preservedDf);
  previousBandwidth = bandwidthEl.value;
  reset();
});

playBtn.addEventListener("click",() => {
  if(timer){
    stop();
    return;
  }
  playBtn.textContent = "停止";
  timer = setInterval(advance,Number(speedEl.value));
});

document.getElementById("step").addEventListener("click",() => {
  stop();
  advance();
});

document.getElementById("pause").addEventListener("click",stop);
document.getElementById("reset").addEventListener("click",reset);
document.getElementById("fill").addEventListener("click",fillAll);

document.getElementById("togglePhase").addEventListener("click",() => {
  showIdeal = !showIdeal;
  document.getElementById("togglePhase").textContent =
    showIdeal ? "オフレゾナンスあり表示" : "オフレゾナンスなし表示";
  render();
});

document.getElementById("clear").addEventListener("click",() => {
  stop();
  vectors.clear();
  seqIndex = 0;
  current = {stage:"待機",kx:null,ky:null,adc:false};
  render();
});

document.getElementById("showCheck").addEventListener("click",() => {
  showCheckDetails = !showCheckDetails;
  render();
});

real.addEventListener("pointerdown",event => {
  const rect = real.getBoundingClientRect();
  const scale = real.width/rect.width;
  const px = (event.clientX-rect.left)*scale;
  const py = (event.clientY-rect.top)*scale;

  const left = 54;
  const top = 42;
  const size = 384;
  const cell = size/N;

  const ix = Math.floor((px-left)/cell);
  const iy = Math.floor((py-top)/cell);

  if(ix<0 || ix>=N || iy<0 || iy>=N) return;

  pEl.value = String(kMin()+ix);
  qEl.value = String(kMax()-iy);
  reset();
});

configureShiftSlider();
buildSequence();
runSelfTests();
render();
})();
</script>
</body>
