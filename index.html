<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>k-space Cycle & Off-resonance Simulator</title>
<style>
:root{
  --bg:#f4f4f4; --card:#fff; --text:#111; --muted:#666;
  --grid:#a5a5a5; --blue:#243d7a; --red:#d93b4b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:1040px;margin:0 auto;padding:10px 7px 28px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:2px 3px 8px}
h1{font-size:18px;margin:0}
.subtitle{font-size:11px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.panel h2{text-align:center;font-size:18px;margin:7px 0}
.card{background:#fff;border:1px solid #ddd;border-radius:11px;padding:5px}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{margin-top:9px;background:#fff;border:1px solid #ddd;border-radius:11px;padding:9px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
label{font-size:11px;font-weight:700}
select,input,button{
  width:100%;font:inherit;border:1px solid #aaa;border-radius:9px;background:#fff;
  min-height:39px;padding:7px
}
button{font-weight:800}
button.primary{background:#111;color:#fff}
.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
.readout>div{border:1px solid #ddd;background:#fafafa;border-radius:9px;text-align:center;padding:6px 2px;font-size:10px}
.readout b{display:block;font-size:14px;margin-top:2px}
.explain{margin-top:8px;background:#fff7da;border:1px solid #eadb99;border-radius:9px;padding:8px;font-size:12px;line-height:1.5}
.legend{font-size:11px;color:#666;margin-top:6px}
@media(max-width:560px){
  .app{padding:7px 5px 22px}
  h1{font-size:15px}
  .subtitle{font-size:10px}
  .panel h2{font-size:16px}
  .card{padding:3px}
  .row{grid-template-columns:repeat(2,1fr)}
  .readout{grid-template-columns:repeat(4,1fr)}
  .readout b{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>k-space Cycle & Off-resonance Simulator</h1>
    <div class="subtitle">(p, q)＝x方向にpサイクル、y方向にqサイクル</div>
  </div>
</header>

<main class="grid2">
  <section class="panel">
    <h2>実空間の位相</h2>
    <div class="card"><canvas id="phaseCanvas" width="440" height="440"></canvas></div>
  </section>
  <section class="panel">
    <h2>k 空間・取得順</h2>
    <div class="card"><canvas id="kCanvas" width="440" height="440"></canvas></div>
  </section>
  <section class="panel">
    <h2>理想再構成</h2>
    <div class="card"><canvas id="idealCanvas" width="440" height="440"></canvas></div>
  </section>
  <section class="panel">
    <h2>オフレゾナンスあり</h2>
    <div class="card"><canvas id="offCanvas" width="440" height="440"></canvas></div>
  </section>
</main>

<section class="controls">
  <div class="row">
    <label>p（kx）
      <input id="p" type="range" min="-4" max="4" step="1" value="2">
    </label>
    <label>q（ky）
      <input id="q" type="range" min="-4" max="4" step="1" value="1">
    </label>
    <label>取得順
      <select id="order">
        <option value="linear">Linear ky</option>
        <option value="centric">Centric ky</option>
        <option value="epi">Single-shot EPI</option>
      </select>
    </label>
    <label>オフレゾナンス Δf
      <input id="df" type="range" min="-80" max="80" step="5" value="30">
    </label>
  </div>

  <div class="row">
    <label>echo spacing
      <input id="esp" type="range" min="1" max="10" step="1" value="4">
    </label>
    <button id="step">1点進める</button>
    <button id="play" class="primary">再生</button>
    <button id="reset">リセット</button>
  </div>

  <div class="readout">
    <div>選択点<b id="pq">(2, 1)</b></div>
    <div>x周期数<b id="px">2</b></div>
    <div>y周期数<b id="qy">1</b></div>
    <div>取得時刻<b id="time">0 ms</b></div>
  </div>

  <div class="explain" id="explain">
    (2,1)では、視野全体でx方向に2周期、y方向に1周期の位相変化を持つ基底関数を測定します。
  </div>
  <div class="legend">色は位相を表します。オフレゾナンスは取得時刻に応じて追加位相 2πΔf·t を与えます。</div>
</section>
</div>

<script>
(() => {
  const phaseCanvas=document.getElementById('phaseCanvas');
  const kCanvas=document.getElementById('kCanvas');
  const idealCanvas=document.getElementById('idealCanvas');
  const offCanvas=document.getElementById('offCanvas');
  const pEl=document.getElementById('p');
  const qEl=document.getElementById('q');
  const orderEl=document.getElementById('order');
  const dfEl=document.getElementById('df');
  const espEl=document.getElementById('esp');
  const pqEl=document.getElementById('pq');
  const pxEl=document.getElementById('px');
  const qyEl=document.getElementById('qy');
  const timeEl=document.getElementById('time');
  const explainEl=document.getElementById('explain');
  const playBtn=document.getElementById('play');

  const N=16;
  let index=0,timer=null;
  let acquisition=[];

  function phaseColor(phi){
    const h=((phi%(2*Math.PI))+2*Math.PI)%(2*Math.PI)*180/Math.PI;
    return `hsl(${h},75%,52%)`;
  }

  function clear(ctx){
    ctx.clearRect(0,0,440,440);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,440,440);
  }

  function generateOrder(){
    const coords=[];
    const half=N/2;
    const kys=[...Array(N)].map((_,i)=>i-half);
    if(orderEl.value==='centric'){
      kys.sort((a,b)=>Math.abs(a)-Math.abs(b) || a-b);
    }
    if(orderEl.value==='epi'){
      kys.forEach((ky,r)=>{
        const kxs=[...Array(N)].map((_,i)=>i-half);
        if(r%2===1)kxs.reverse();
        kxs.forEach(kx=>coords.push({kx,ky}));
      });
    }else{
      kys.forEach(ky=>{
        for(let kx=-half;kx<half;kx++)coords.push({kx,ky});
      });
    }
    acquisition=coords;
    index=Math.min(index,acquisition.length-1);
  }

  function drawPhase(){
    const ctx=phaseCanvas.getContext('2d');clear(ctx);
    const p=+pEl.value,q=+qEl.value;
    const margin=24,size=392,n=64,cell=size/n;
    for(let j=0;j<n;j++){
      const y=(j+.5)/n-.5;
      for(let i=0;i<n;i++){
        const x=(i+.5)/n-.5;
        const phi=2*Math.PI*(p*x+q*y);
        ctx.fillStyle=phaseColor(phi);
        ctx.fillRect(margin+i*cell,margin+j*cell,cell+0.5,cell+0.5);
      }
    }
    ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.strokeRect(margin,margin,size,size);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(28,30,155,30);
    ctx.fillStyle='#111';ctx.font='15px sans-serif';
    ctx.fillText(`φ=2π(${p}x+${q}y)`,36,50);
  }

  function drawK(){
    const ctx=kCanvas.getContext('2d');clear(ctx);
    const margin=38,size=364,cell=size/N,half=N/2;
    ctx.strokeStyle='#aaa';ctx.lineWidth=.7;
    for(let i=0;i<=N;i++){
      const z=margin+i*cell;
      ctx.beginPath();ctx.moveTo(z,margin);ctx.lineTo(z,margin+size);ctx.stroke();
      ctx.beginPath();ctx.moveTo(margin,z);ctx.lineTo(margin+size,z);ctx.stroke();
    }
    const acquired=new Set(acquisition.slice(0,index).map(v=>`${v.kx},${v.ky}`));
    for(let ky=-half;ky<half;ky++)for(let kx=-half;kx<half;kx++){
      const cx=margin+(kx+half+.5)*cell,cy=margin+(half-ky-.5)*cell;
      ctx.fillStyle=acquired.has(`${kx},${ky}`)?'#243d7a':'#c0c8d7';
      ctx.beginPath();ctx.arc(cx,cy,acquired.has(`${kx},${ky}`)?3.4:1.6,0,Math.PI*2);ctx.fill();
    }
    const cur=acquisition[Math.min(index,acquisition.length-1)];
    if(cur){
      const cx=margin+(cur.kx+half+.5)*cell,cy=margin+(half-cur.ky-.5)*cell;
      ctx.strokeStyle='#d93b4b';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.stroke();
    }
    const p=+pEl.value,q=+qEl.value;
    const sx=margin+(p+half+.5)*cell,sy=margin+(half-q-.5)*cell;
    ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.strokeRect(sx-cell*.38,sy-cell*.38,cell*.76,cell*.76);
  }

  function objectAt(x,y){
    const a=Math.exp(-((x+0.17)**2+(y+0.08)**2)/0.018);
    const b=0.8*Math.exp(-((x-0.18)**2+(y-0.17)**2)/0.009);
    const c=0.5*Math.exp(-((x-0.06)**2+(y+0.24)**2)/0.005);
    return a+b+c;
  }

  function dftReconstruct(withOff){
    const M=48;
    const kdata=[];
    const half=N/2;
    const esp=+espEl.value/1000;
    const df=+dfEl.value;
    const orderMap=new Map(acquisition.map((v,i)=>[`${v.kx},${v.ky}`,i]));
    for(let ky=-half;ky<half;ky++){
      for(let kx=-half;kx<half;kx++){
        let re=0,im=0;
        for(let yy=0;yy<M;yy++){
          const y=(yy+.5)/M-.5;
          for(let xx=0;xx<M;xx++){
            const x=(xx+.5)/M-.5;
            const rho=objectAt(x,y);
            const ph=-2*Math.PI*(kx*x+ky*y);
            re+=rho*Math.cos(ph);im+=rho*Math.sin(ph);
          }
        }
        if(withOff){
          const ti=orderMap.get(`${kx},${ky}`) ?? 0;
          const ph=2*Math.PI*df*ti*esp;
          const nr=re*Math.cos(ph)-im*Math.sin(ph);
          const ni=re*Math.sin(ph)+im*Math.cos(ph);
          re=nr;im=ni;
        }
        kdata.push({kx,ky,re,im});
      }
    }
    const out=new Float32Array(M*M);
    let vmax=0;
    for(let yy=0;yy<M;yy++){
      const y=(yy+.5)/M-.5;
      for(let xx=0;xx<M;xx++){
        const x=(xx+.5)/M-.5;
        let re=0,im=0;
        for(const k of kdata){
          const ph=2*Math.PI*(k.kx*x+k.ky*y);
          re+=k.re*Math.cos(ph)-k.im*Math.sin(ph);
          im+=k.re*Math.sin(ph)+k.im*Math.cos(ph);
        }
        const v=Math.hypot(re,im);
        out[yy*M+xx]=v;if(v>vmax)vmax=v;
      }
    }
    return {out,M,vmax};
  }

  function drawRecon(canvas,withOff){
    const ctx=canvas.getContext('2d');clear(ctx);
    const {out,M,vmax}=dftReconstruct(withOff);
    const img=ctx.createImageData(M,M);
    for(let i=0;i<out.length;i++){
      const v=Math.max(0,Math.min(255,255*Math.pow(out[i]/vmax,.55)));
      img.data[i*4]=v;img.data[i*4+1]=v;img.data[i*4+2]=v;img.data[i*4+3]=255;
    }
    const tmp=document.createElement('canvas');tmp.width=M;tmp.height=M;
    tmp.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(tmp,24,24,392,392);
    ctx.strokeStyle='#111';ctx.strokeRect(24,24,392,392);
  }

  function currentTimeMs(){
    return index*(+espEl.value);
  }

  function render(){
    generateOrder();
    drawPhase();drawK();drawRecon(idealCanvas,false);drawRecon(offCanvas,true);
    const p=+pEl.value,q=+qEl.value;
    pqEl.textContent=`(${p}, ${q})`;pxEl.textContent=Math.abs(p);qyEl.textContent=Math.abs(q);
    timeEl.textContent=`${currentTimeMs()} ms`;
    explainEl.textContent=`(${p},${q})は、FOV内でx方向に${Math.abs(p)}周期、y方向に${Math.abs(q)}周期の位相変化を持つ基底です。取得順が変わると各k点の取得時刻が変わり、Δfによる追加位相の並び方も変わります。`;
  }

  function stop(){if(timer){clearInterval(timer);timer=null}playBtn.textContent='再生'}
  document.getElementById('step').onclick=()=>{stop();index=Math.min(index+1,N*N-1);render()};
  playBtn.onclick=()=>{
    if(timer){stop();return}
    playBtn.textContent='停止';
    timer=setInterval(()=>{index++;if(index>=N*N-1){index=N*N-1;stop()}render()},45);
  };
  document.getElementById('reset').onclick=()=>{stop();index=0;render()};
  [pEl,qEl,orderEl,dfEl,espEl].forEach(el=>el.addEventListener('input',()=>{stop();render()}));

  generateOrder();render();
})();
</script>
</body>
</html>
