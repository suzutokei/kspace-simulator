<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>k-space Vector Simulator</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#111;--muted:#666;--blue:#253d7a;--red:#d93b4b;--grid:#999}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:1000px;margin:auto;padding:8px 6px 24px}
header h1{font-size:18px;margin:4px 2px 2px}
header p{font-size:11px;color:var(--muted);margin:0 2px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.panel h2{text-align:center;font-size:17px;margin:6px 0}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:3px}
canvas{width:100%;height:auto;display:block;touch-action:none}
.controls{margin-top:8px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
label{font-size:11px;font-weight:700}
input,select,button{width:100%;min-height:38px;border:1px solid #aaa;border-radius:8px;background:#fff;font:inherit;padding:6px}
button{font-weight:800}
button.primary{background:#111;color:#fff}
.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.readout div{border:1px solid #ddd;background:#fafafa;border-radius:8px;text-align:center;padding:6px 2px;font-size:10px}
.readout b{display:block;font-size:13px;margin-top:2px}
.explain{margin-top:7px;background:#fff7da;border:1px solid #eadb99;border-radius:8px;padding:8px;font-size:12px;line-height:1.45}
@media(max-width:560px){
  header h1{font-size:15px}
  .panel h2{font-size:15px}
  .row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>k-space Vector Simulator</h1>
  <p>各k空間点の矢印＝その点で測定される複素信号ベクトル</p>
</header>

<main class="two">
  <section class="panel">
    <h2>実空間：1個のスピン</h2>
    <div class="card"><canvas id="real" width="440" height="440"></canvas></div>
  </section>
  <section class="panel">
    <h2>k空間：複素ベクトル</h2>
    <div class="card"><canvas id="kspace" width="440" height="440"></canvas></div>
  </section>
</main>

<section class="controls">
  <div class="row">
    <label>取得順
      <select id="order">
        <option value="linear">Linear</option>
        <option value="centric">Centric</option>
        <option value="epi">EPI zig-zag</option>
      </select>
    </label>
    <label>Δf (Hz)
      <input id="df" type="range" min="-100" max="100" value="0" step="5">
    </label>
    <label>echo spacing (ms)
      <input id="esp" type="range" min="1" max="10" value="4" step="1">
    </label>
    <label>初期位相
      <input id="phi0" type="range" min="0" max="360" value="0" step="15">
    </label>
  </div>
  <div class="row">
    <button id="step">1点進める</button>
    <button id="play" class="primary">再生</button>
    <button id="reset">リセット</button>
    <button id="ideal">理想/実際</button>
  </div>
  <div class="readout">
    <div>スピン位置<b id="xy">(1, 1)</b></div>
    <div>現在点<b id="pq">(-4, -4)</b></div>
    <div>取得時刻<b id="tm">0 ms</b></div>
    <div>ベクトル位相<b id="ang">0°</b></div>
  </div>
  <div class="explain" id="explain"></div>
</section>
</div>

<script>
(() => {
const real=document.getElementById('real'), kspace=document.getElementById('kspace');
const rctx=real.getContext('2d'), kctx=kspace.getContext('2d');
const N=8, half=N/2;
let sx=1, sy=1, index=0, timer=null, showIdeal=false, order=[];

const orderEl=document.getElementById('order'),dfEl=document.getElementById('df'),
espEl=document.getElementById('esp'),phi0El=document.getElementById('phi0');
const xyEl=document.getElementById('xy'),pqEl=document.getElementById('pq'),
tmEl=document.getElementById('tm'),angEl=document.getElementById('ang'),
explainEl=document.getElementById('explain'),playBtn=document.getElementById('play'),
idealBtn=document.getElementById('ideal');

function clear(ctx){ctx.clearRect(0,0,440,440);ctx.fillStyle='#fff';ctx.fillRect(0,0,440,440)}
function makeOrder(){
  const kys=[-4,-3,-2,-1,0,1,2,3];
  if(orderEl.value==='centric') kys.sort((a,b)=>Math.abs(a)-Math.abs(b)||a-b);
  const out=[];
  kys.forEach((q,r)=>{
    let ps=[-4,-3,-2,-1,0,1,2,3];
    if(orderEl.value==='epi' && r%2) ps=ps.reverse();
    ps.forEach(p=>out.push({p,q}));
  });
  order=out;
  index=Math.min(index,order.length-1);
}
function timeOf(p,q){
  const i=order.findIndex(v=>v.p===p&&v.q===q);
  return Math.max(0,i)*Number(espEl.value)/1000;
}
function phaseAt(p,q,ideal=false){
  const phi0=Number(phi0El.value)*Math.PI/180;
  const spatial=-2*Math.PI*(p*sx/N+q*sy/N);
  const off=ideal?0:2*Math.PI*Number(dfEl.value)*timeOf(p,q);
  return phi0+spatial+off;
}
function deg(a){return ((a*180/Math.PI)%360+360)%360}
function arrow(ctx,cx,cy,a,len,color,width=2){
  const ex=cx+len*Math.cos(a),ey=cy-len*Math.sin(a);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);ctx.stroke();
  const h=5,ph=Math.atan2(ey-cy,ex-cx);
  ctx.beginPath();ctx.moveTo(ex,ey);
  ctx.lineTo(ex-h*Math.cos(ph-Math.PI/6),ey-h*Math.sin(ph-Math.PI/6));
  ctx.lineTo(ex-h*Math.cos(ph+Math.PI/6),ey-h*Math.sin(ph+Math.PI/6));
  ctx.closePath();ctx.fill();
}
function drawGrid(ctx,n=8){
  const m=38,s=364,c=s/n;
  ctx.strokeStyle='#999';ctx.lineWidth=.8;
  for(let i=0;i<=n;i++){const z=m+i*c;
    ctx.beginPath();ctx.moveTo(z,m);ctx.lineTo(z,m+s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(m,z);ctx.lineTo(m+s,z);ctx.stroke();
  }
  return {m,s,c};
}
function drawReal(){
  clear(rctx); const {m,s,c}=drawGrid(rctx,N);
  const cx=m+s/2+sx*c, cy=m+s/2-sy*c;
  arrow(rctx,cx,cy,Number(phi0El.value)*Math.PI/180,28,'#253d7a',5);
  rctx.fillStyle='#d93b4b';rctx.beginPath();rctx.arc(cx,cy,5,0,Math.PI*2);rctx.fill();
  rctx.fillStyle='#111';rctx.font='14px sans-serif';
  rctx.fillText('(0,0)',m+s/2-20,m+s/2+20);
  rctx.fillText(`(${sx},${sy})`,cx+8,cy+5);
}
function drawK(){
  clear(kctx); const {m,s,c}=drawGrid(kctx,N);
  const acquired=new Set(order.slice(0,index).map(v=>`${v.p},${v.q}`));
  for(let q=-4;q<=3;q++)for(let p=-4;p<=3;p++){
    const cx=m+(p+half+.5)*c,cy=m+(half-q-.5)*c;
    const a=phaseAt(p,q,showIdeal);
    arrow(kctx,cx,cy,a,c*.34,acquired.has(`${p},${q}`)?'#253d7a':'#aeb8ca',1.8);
    kctx.fillStyle=acquired.has(`${p},${q}`)?'#253d7a':'#aeb8ca';
    kctx.beginPath();kctx.arc(cx,cy,2.2,0,Math.PI*2);kctx.fill();
  }
  const cur=order[index];
  if(cur){
    const cx=m+(cur.p+half+.5)*c,cy=m+(half-cur.q-.5)*c;
    kctx.strokeStyle='#d93b4b';kctx.lineWidth=2;
    kctx.strokeRect(cx-c*.43,cy-c*.43,c*.86,c*.86);
    pqEl.textContent=`(${cur.p}, ${cur.q})`;
    tmEl.textContent=`${Math.round(timeOf(cur.p,cur.q)*1000)} ms`;
    angEl.textContent=`${Math.round(deg(phaseAt(cur.p,cur.q,showIdeal)))}°`;
  }
  kctx.fillStyle='#111';kctx.font='13px sans-serif';
  kctx.fillText('(0,0)',m+s/2-18,m+s/2+18);
}
function render(){
  makeOrder();drawReal();drawK();xyEl.textContent=`(${sx}, ${sy})`;
  const cur=order[index];
  if(cur){
    explainEl.textContent=`k空間点 (${cur.p},${cur.q}) のベクトル位相は、空間位相 −2π(${cur.p}·${sx}/8 + ${cur.q}·${sy}/8)`+
    (showIdeal?' だけです。':` に、取得時刻によるオフレゾナンス位相 2π·${dfEl.value}·t が加わります。取得順を変えると t(p,q) が変わるため、ベクトル配列が変化します。`);
  }
}
function stop(){if(timer){clearInterval(timer);timer=null}playBtn.textContent='再生'}
document.getElementById('step').onclick=()=>{stop();index=Math.min(index+1,order.length-1);render()};
playBtn.onclick=()=>{if(timer){stop();return}playBtn.textContent='停止';timer=setInterval(()=>{index++;if(index>=order.length-1){index=order.length-1;stop()}render()},90)};
document.getElementById('reset').onclick=()=>{stop();index=0;render()};
idealBtn.onclick=()=>{showIdeal=!showIdeal;idealBtn.textContent=showIdeal?'理想表示中':'実際表示中';render()};
[orderEl,dfEl,espEl,phi0El].forEach(el=>el.addEventListener('input',()=>{stop();render()}));
real.addEventListener('pointerdown',e=>{
  const rect=real.getBoundingClientRect(),scale=real.width/rect.width;
  const px=(e.clientX-rect.left)*scale,py=(e.clientY-rect.top)*scale;
  const m=38,s=364,c=s/N;
  sx=Math.max(-4,Math.min(3,Math.round((px-(m+s/2))/c)));
  sy=Math.max(-4,Math.min(3,Math.round(((m+s/2)-py)/c)));
  render();
});
makeOrder();render();
})();
</script>
</body>
</html>
